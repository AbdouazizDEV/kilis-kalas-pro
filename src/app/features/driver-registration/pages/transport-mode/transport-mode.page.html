<ion-content [fullscreen]="true">
  <div class="page-container">
    <app-back-button></app-back-button>
    <h1 class="page-title">{{ 'DRIVER.TRANSPORT.TITLE' | translate }}</h1>
    <p class="page-subtitle">{{ 'DRIVER.TRANSPORT.SUBTITLE' | translate }}</p>

    <div class="transport-options">
      @for (option of options; track option.mode) {
        <button
          type="button"
          class="transport-option"
          [class.transport-option--selected]="selectedMode === option.mode"
          (click)="selectMode(option.mode)"
        >
          <ion-icon [name]="option.icon" class="transport-option__icon"></ion-icon>
          <div class="transport-option__text">
            <ion-text class="transport-option__label">{{ option.labelKey | translate }}</ion-text>
            <ion-text class="transport-option__desc">{{ option.descriptionKey | translate }}</ion-text>
          </div>
        </button>
      }
    </div>

    <app-button [disabled]="!selectedMode" (buttonClick)="continue()">
      {{ 'COMMON.CONTINUE' | translate }}
    </app-button>
  </div>
</ion-content>
