<ion-grid class="app-period-segment">
  <ion-row class="ion-nowrap">
    @for (option of options; track option.id; let last = $last) {
      <ion-col class="app-period-segment__col">
        <ion-button
          class="app-period-segment__btn"
          [class.app-period-segment__btn--active]="isSelected(option.id)"
          [class.app-period-segment__btn--divider]="!last"
          fill="clear"
          expand="block"
          (click)="onSelect(option.id)"
        >
          {{ option.labelKey | translate }}
        </ion-button>
      </ion-col>
    }
  </ion-row>
</ion-grid>
